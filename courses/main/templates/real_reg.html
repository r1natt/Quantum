{% load static %}

<html lang="en">
  <head>
    <title>Registration</title>
    <link rel="stylesheet" href="{% static 'register.css' %}">
    <style>
		* {
		  font-family: 'Roboto', sans-serif;
		}
		
		body {
		  min-height: 100vh;
		  margin: 0;
		  display: flex;
		  align-items: center;
		  justify-content: center;
		}
		
		.foot-form-cont {
		  width: 400px;
		  background-color: #ffffff;
		  padding: 20px;
		  border-radius: 20px;
		  box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
		  transform: translateY(-30px);
		}
  
		.foot-form-title {
		  color: #333333;
		  font-weight: 500;
		  margin-bottom: 15px;
		  padding: 0.3em 0;
		  text-align: center;
		  font-size: 1.8em;
		  letter-spacing: 0.5px;
		}
  
		.sub-input {
		  width: 100%;
		  margin-bottom: 10px;
		  padding: 10px 15px;
		  border-radius: 10px;
		  color: #333333;
		  background-color: #f5f5f5;
		  border: 1px solid #e0e0e0;
		  font-size: 16px;
		  font-weight: 300;
		  transition: all 0.3s ease;
		}
  
		.sub-input:focus {
		  outline: none;
		  border-color: #785580;
		  background-color: #ffffff;
		}
  
		.sub-btn {
		  width: 100%;
		  margin: 15px 0;
		  background-color: #785580;
		  border: none;
		  color: #fff;
		  border-radius: 10px;
		  padding: 10px 15px;
		  font-size: 1em;
		  font-weight: 500;
		  cursor: pointer;
		  transition: all 0.3s ease;
		  letter-spacing: 0.5px;
		}
  
		.sub-btn:hover {
		  background-color: #91699a;
		  transform: translateY(-2px);
		}
  
		.sub-btn:active {
		  background-color: #573f5c;
		  transform: translateY(0);
		}
  
		.foot-form-cont p {
		  text-align: center;
		  color: #666666;
		  margin-top: 10px;
		  font-weight: 300;
		  font-size: 0.9em;
		}
  
		.foot-form-cont a {
		  color: #785580;
		  text-decoration: none;
		  font-weight: 500;
		  transition: color 0.3s ease;
		}
  
		.foot-form-cont a:hover {
		  color: #573f5c;
		}

        /* Additional styles for registration form */
        label {
            display: block;
            margin-bottom: 5px;
            color: #333333;
            font-size: 0.9em;
        }

        .helptext {
            display: block;
            font-size: 0.8em;
            color: #666666;
            margin-top: 2px;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 10px;
            color: #333333;
            background-color: #f5f5f5;
            border: 1px solid #e0e0e0;
            font-size: 16px;
            font-weight: 300;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #785580;
            background-color: #ffffff;
        }
	</style>
  </head>

  <body>
    <div class="foot-form-cont">
        <div class="foot-form-title">Регистрация в Quantum</div>
        <form method="post">
            {% csrf_token %}
            <p>
                <label for="id_username">Username:</label>
                <input type="text" name="username" maxlength="150" required id="id_username">
                <span class="helptext">Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.</span>
            </p>
            <p>
                <label for="id_password">Password:</label>
                <input type="password" name="password" required id="id_password">
            </p>
            <p>
                <label for="id_password_confirm">Confirm Password:</label>
                <input type="password" name="password_confirm" required id="id_password_confirm">
            </p>
            <button type="submit" class="sub-btn">Зарегистрироваться</button>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
  </body>
</html>
