{% load static %}

<!DOCTYPE html>
<html>

<head>
  <title>{{ task_group_name }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="generator" content="GrapesJS Studio">
  <link rel="stylesheet" href="{% static 'task.css' %}">
</head>

<body id="i53qac">
  {% include "header.html" %}
  <div class="gjs-grid-row" id="iqswes">
    <div class="gjs-grid-column" id="ifksyk">
      <div class="gjs-grid-row" id="i8a9yd">
        <div class="gjs-grid-column" id="irum59">
          <div class="text-main-content" id="i6tw2x">{{ task_group_name }}</div>
          <div class="text-main-content" id="ihstf4">{{ task.name }}</div>
          <div class="text-main-content" id="iu6srs">{{ task.text }}<br/></div>
          <form method="post" id="igqle7" onsubmit="return validateForm()">
            {% csrf_token %}
            <div class="input-group" style="margin: 20px;">
              <label for="answer">Ответ:</label>
              <input type="text" id="answer" name="answer" placeholder="Введите ваш ответ" oninput="validateInput(this)" pattern="[0-9eE.+-]*">
            </div>
            <button type="submit" id="i9eraa">Отправить</button>
          </form>

          <script>
            function validateInput(input) {
              // Разрешаем только цифры, e, E, точку, + и -
              input.value = input.value.replace(/[^0-9eE.+-]/g, '');
              
              // Проверяем, что e/E встречается только один раз
              const eCount = (input.value.match(/[eE]/g) || []).length;
              if (eCount > 1) {
                input.value = input.value.replace(/[eE].*[eE]/, 'e');
              }
              
              // Проверяем, что точка встречается только один раз
              const dotCount = (input.value.match(/\./g) || []).length;
              if (dotCount > 1) {
                input.value = input.value.replace(/\.(?=.*\.)/g, '');
              }
            }

            function validateForm() {
              const answer = document.getElementById('answer').value;
              if (!answer) {
                alert('Пожалуйста, введите ответ');
                return false;
              }
              return true;
            }
          </script>

        </div>
      </div>
    </div>
  </div>
  <!-- {% include "footer.html" %} -->
</body>
