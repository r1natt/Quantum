<body id="iw3mdg-2">

  <div id="iwcht1-2" class="gjs-grid-row">

          <div class="text-main-content">
            <div class="calculator-header">
							Внешний фотоэффект
            </div>
            <div class="formula-display">
              \[E_k = h \cdot \frac{c}{\lambda} - A_{вых}\]
            </div>
            <div class="input-group" style="margin-left: 20px;">
              <label for="metal">Металл:</label>
              <select id="metal" name="metal" onchange="calculate()">
                <option value="3.74e-19">Алюминий</option>
                <option value="4.5e-19">Вольфрам</option>
                <option value="2.15e-19">Калий</option>
                <option value="2.39e-19">Литий</option>
                <option value="4.47e-19">Медь</option>
                <option value="2.27e-19">Натрий</option>
                <option value="4.84e-19">Никель</option>
                <option value="5.29e-19">Платина</option>
                <option value="4.28e-19">Серебро</option>
                <option value="1.89e-19">Цезий</option>
                <option value="3.74e-19">Цинк</option>
                <option value="0.99e-19">Оксид бария</option>
              </select>
            </div>
            <div class="input-group" style="margin-left: 20px;">
              <label for="b">λ (м):</label>
              <input type="text" id="b" name="b" oninput="calculate()" placeholder="Например: 1e-9">
            </div>
            <div id="result" style="margin-left: 20px;">
              <span>E_k (Дж):</span>
              <span id="resultValue">-</span>
            </div>

            <script>
              const x = 6.63e-34;  // Постоянная Планка
              const a = 3e8;      // Скорость света

              function calculate() {
                const bInput = document.getElementById('b').value;
                const b = parseFloat(bInput);
                const c = parseFloat(document.getElementById('metal').value);
                
                if (isNaN(b) || b === 0) {
                  document.getElementById('resultValue').textContent = 'Введите корректное значение λ';
                  return;
                }

                const result = x * (a / b) - c;
                document.getElementById('resultValue').textContent = result.toExponential(4);
              }
            </script>
            
          </div>
        </div>
      </div>
    </div>
  </div>
