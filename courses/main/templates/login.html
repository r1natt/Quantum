{% load static %}

<html lang="en">
  <head>
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
	<style>
		* {
		  font-family: 'Roboto', sans-serif;
		}
		
		body {
		  min-height: 100vh;
		  margin: 0;
		  display: flex;
		  align-items: center;
		  justify-content: center;
		}
		
		.foot-form-cont {
		  width: 400px;
		  background-color: #ffffff;
		  padding: 20px;
		  border-radius: 20px;
		  box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
		  transform: translateY(-30px); /* Move up by 30px */
		}
  
		.foot-form-title {
		  color: #333333;
		  font-weight: 500;
		  margin-bottom: 15px;
		  padding: 0.3em 0;
		  text-align: center;
		  font-size: 1.8em;
		  letter-spacing: 0.5px;
		}
  
		.sub-input {
		  width: 100%;
		  margin-bottom: 10px;
		  padding: 10px 15px;
		  border-radius: 10px;
		  color: #333333;
		  background-color: #f5f5f5;
		  border: 1px solid #e0e0e0;
		  font-size: 16px;
		  font-weight: 300;
		  transition: all 0.3s ease;
		}
  
		.sub-input:focus {
		  outline: none;
		  border-color: #785580;
		  background-color: #ffffff;
		}
  
		.sub-btn {
		  width: 100%;
		  margin: 15px 0;
		  background-color: #785580;
		  border: none;
		  color: #fff;
		  border-radius: 10px;
		  padding: 10px 15px;
		  font-size: 1em;
		  font-weight: 500;
		  cursor: pointer;
		  transition: all 0.3s ease;
		  letter-spacing: 0.5px;
		}
  
		.sub-btn:hover {
		  background-color: #91699a;
		  transform: translateY(-2px);
		}
  
		.sub-btn:active {
		  background-color: #573f5c;
		  transform: translateY(0);
		}
  
		.foot-form-cont p {
		  text-align: center;
		  color: #666666;
		  margin-top: 10px;
		  font-weight: 300;
		  font-size: 0.9em;
		}
  
		.foot-form-cont a {
		  color: #785580;
		  text-decoration: none;
		  font-weight: 500;
		  transition: color 0.3s ease;
		}
  
		.foot-form-cont a:hover {
		  color: #573f5c;
		}
	  </style>
  </head>

  <body id="itk5xa">
		<div class="foot-form-cont" id="i4tohk">
			<div class="gjs-grid-row" id="ipig1q">
				<div class="gjs-grid-column" id="ipixn7">
					<div class="foot-form-title" id="i62sb9">Войти в Quantum</div>
						<form method="post">
							{% csrf_token %}
							<input type="text" name="username" id="username" class="sub-input">
							<input type="password" name="password" id="password" class="sub-input">
							<button type="sumbit" class="sub-btn">Войти</button>
						</form>
						{% if error %}  
							<p class="error">{{ error }}</p>  
						{% endif %}
						<p>Не зарегистрированы? <a href="{% url 'register' %}">Зарегистрироваться</a></p>  
					</div>
				</div>
			</div>
	  </div>
  </body>
</html>
