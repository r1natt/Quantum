<body id="iw3mdg-2">

  {% include "header.html" %}

  <div id="iwcht1-2" class="gjs-grid-row">

        <div id="i2rmok-2" class="gjs-grid-column">
          <div id="ikridk-2" class="text-main-content">
            <div class="calculator">
              <div class="formula-display">
                \[ Loss_{ST} = \frac{\overline{N_s}}{\overline{N_{ST}}} \]
              </div>
              <div class="input-group">
                <label for="x">\(\overline{N_s}\):</label>
                <input type="number" id="x" placeholder="Введите значение">
              </div>
              <div class="input-group">
                <label for="y">\(\overline{N_{ST}}\):</label>
                <input type="number" id="y" placeholder="Введите значение">
              </div>
              <div id="result">
                <span>\(Loss_{ST}\):</span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const x = parseFloat(document.getElementById('x').value);
      const y = parseFloat(document.getElementById('y').value);
      const result = document.getElementById('result');
      const resultValue = result.querySelector('span:last-child');
      
      if (isNaN(x) || isNaN(y)) {
        resultValue.innerHTML = '';
        MathJax.typeset([result]);
        return;
      }
      
      if (y === 0) {
        resultValue.innerHTML = 'Ошибка: деление на ноль невозможно';
        return;
      }
      
      const z = x / y;
      resultValue.innerHTML = z.toFixed(2);
      MathJax.typeset([result]);
    }

    // Add event listeners for dynamic calculation
    document.getElementById('x').addEventListener('input', calculate);
    document.getElementById('y').addEventListener('input', calculate);
  </script>
